<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="テキサスホールデムの用語を日本語で引ける初心者向け辞書。">
  <title>Hold'em Dictionary — 用語を、すぐ引ける。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#top" aria-label="ホーム"><span class="mark">H</span><span>HOLD'EM <b>DICTIONARY</b></span></a><a class="about" href="../docs/research.md">この辞書について <span>↗</span></a></header>
  <main id="top">
    <section class="hero">
      <div class="eyebrow"><span></span> TEXAS HOLD'EM GLOSSARY</div>
      <h1>用語を、<em>すぐ引ける。</em></h1>
      <p class="lead">テキサスホールデムの「これって何？」を、<br class="desktop">日本語でシンプルに解説します。</p>
      <label class="searchbox"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="用語を検索（例：オールイン、all-in）" aria-label="用語を検索"><kbd>/</kbd></label>
      <div class="popular"><span>POPULAR</span><button data-query="オールイン">オールイン</button><button data-query="ポジション">ポジション</button><button data-query="ブラフ">ブラフ</button><button data-query="フロップ">フロップ</button></div>
    </section>
    <section class="library">
      <div class="section-head"><div><div class="eyebrow">THE GLOSSARY</div><h2>用語一覧 <span id="count"></span></h2></div><div class="sortlabel">A—Z <span>⌄</span></div></div>
      <nav id="filters" class="filters" aria-label="カテゴリ"></nav>
      <div id="terms" class="term-grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden>該当する用語が見つかりません。別のキーワードでお試しください。</p>
    </section>
    <aside class="note"><span class="note-icon">✳</span><div><b>はじめての方へ</b><p>まずは <button data-query="ブラインド">ブラインド</button>、<button data-query="チェック">チェック</button>、<button data-query="フロップ">フロップ</button> から。関連語をたどると、ゲームの流れもつかめます。</p></div><span class="note-arrow">↗</span></aside>
  </main>
  <footer><span>HOLD'EM DICTIONARY</span><span>学びのための用語集 · 出典は調査メモを参照</span><span>© 2026</span></footer>
  <script src="app.js"></script>
</body>
</html>
